[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photonforge"
version = "0.1.0"
description = "高速多参考图图像生成与编辑引擎（Rectified Flow / DiT / VAE / IP-Adapter / 长提示词 / 级联 4K）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "huzjie" }]
keywords = ["text-to-image", "rectified-flow", "flow-matching", "dit", "diffusion-transformer", "vae", "ip-adapter", "reference-image", "image-generation", "image-editing", "inpainting", "4k", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
yaml = ["pyyaml>=6.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
all = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "pyyaml>=6.0"]

[project.scripts]
photonforge = "photonforge.cli.main:main"

[tool.setuptools.packages.find]
include = ["photonforge*"]
