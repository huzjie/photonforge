<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>photonforge · 图像生成控制台</title>
  <style>
    :root { --red: #E60012; --ink: #1a1a1a; --muted: #666; --bg: #fafafa; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    header { background: #fff; border-bottom: 2px solid var(--red); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 20px; margin: 0; }
    header .brand { color: var(--red); font-weight: 700; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { background: #fff; border: 1px solid #eee; border-radius: 0; padding: 16px; }
    .panel h2 { font-size: 15px; margin: 0 0 12px; border-left: 3px solid var(--red); padding-left: 8px; }
    textarea { width: 100%; min-height: 120px; font-family: inherit; padding: 10px; border: 1px solid #ddd; resize: vertical; }
    button { background: var(--red); color: #fff; border: none; padding: 10px 20px; font-size: 14px; cursor: pointer; }
    button:hover { opacity: .9; }
    #status { color: var(--muted); font-size: 13px; margin-top: 12px; }
    #canvas { width: 100%; border: 1px solid #eee; background: #fff; image-rendering: pixelated; }
  </style>
</head>
<body>
  <header><span class="brand">photonforge</span><h1>图像生成控制台</h1></header>
  <main>
    <div class="panel">
      <h2>文生图</h2>
      <textarea id="prompt" placeholder="描述你要生成的图像，例如：一只戴红围巾的柴犬，冬日清晨，柔和逆光，4k，电影感"></textarea>
      <p><button onclick="generate()">生成</button></p>
      <div id="status">就绪</div>
    </div>
    <div class="panel">
      <h2>结果</h2>
      <canvas id="canvas" width="512" height="512"></canvas>
    </div>
  </main>
  <script>
    async function generate() {
      const prompt = document.getElementById("prompt").value;
      const status = document.getElementById("status");
      status.textContent = "生成中…";
      const res = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, steps: 12, guidance: 4.5, width: 512, height: 512 }),
      });
      const data = await res.json();
      draw(data.image);
      status.textContent = `完成（${data.elapsed.toFixed(2)}s）`;
    }
    function draw(image) {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const h = image[0].length, w = image[0][0].length;
      canvas.width = w; canvas.height = h;
      const img = ctx.createImageData(w, h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        img.data[i] = Math.max(0, Math.min(255, image[0][y][x] * 255));
        img.data[i+1] = Math.max(0, Math.min(255, image[1][y][x] * 255));
        img.data[i+2] = Math.max(0, Math.min(255, image[2][y][x] * 255));
        img.data[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }
  </script>
</body>
</html>
